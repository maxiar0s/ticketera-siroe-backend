services:
  mysql:
    image: mysql:8.0
    container_name: ss_ticketera_mysql_local
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_DATABASE=ticketera_local
      - MYSQL_USER=ticketera
      - MYSQL_PASSWORD=ticketera123
      - MYSQL_ROOT_PASSWORD=root123
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data_local:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ss_ticketera_minio_local
    command: server /data --console-address ":9001"
    env_file:
      - .env.local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_local:/data
    restart: unless-stopped

  minio-create-bucket:
    image: minio/mc:latest
    container_name: ss_ticketera_minio_bucket_local
    env_file:
      - .env.local
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c
      "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY; do sleep 2; done &&
      mc mb --ignore-existing local/$$S3_BUCKET_NAME"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss_ticketera_back_local
    command: npm run server
    env_file:
      - .env.local
    environment:
      - NODE_ENV=local
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - DB_HOST=mysql
      - DB_PORT=3306
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      minio-create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  seeder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ss_ticketera_seed_local
    command: node ./scripts/seed-if-needed.js
    env_file:
      - .env.local
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
    depends_on:
      mysql:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    restart: "no"

  tickets-cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: ss_ticketera_cron_local
    profiles:
      - cron
    env_file:
      - .env.local
    environment:
      - NODE_ENV=local
      - DB_HOST=mysql
      - DB_PORT=3306
    depends_on:
      minio-create-bucket:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql_data_local:
  minio_data_local:
