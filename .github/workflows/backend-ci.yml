name: Backend CI

on:
  # Ejecuta CI cuando abres/actualizas PRs hacia develop o main.
  pull_request:
    branches: [develop, main]
    paths:
      - '**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-cd.yml'

  # Ejecuta también en pushes directos (por ejemplo hotfix a develop/main).
  push:
    branches: [develop, main]
    paths:
      - '**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/backend-cd.yml'

  # Permite ejecutar CI manualmente desde GitHub Actions.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-backend:
    name: Validate backend (install + syntax)
    runs-on: ubuntu-latest

    steps:
      # 1) Descarga el código del commit/PR.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Prepara Node 18 y cache de npm para acelerar ejecuciones.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3) Instala dependencias de forma reproducible.
      - name: Install dependencies
        run: npm ci

      # 4) Validación mínima: parsea todos los .js con Node.
      #    Esto detecta errores de sintaxis antes del deploy.
      - name: Syntax check (all JS/CJS files)
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(git ls-files '*.js' '*.cjs')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JS/CJS files found to check"
            exit 0
          fi

          for file in "${files[@]}"; do
            node --check "$file"
          done
