components:
  schemas:
    ApiResponse:
      type: object
      properties:
        message:
          type: string
        data:
          description: Payload devuelto por el servicio.
    ListResponse:
      type: object
      properties:
        total:
          type: integer
          example: 1
        items:
          type: array
          items:
            type: object
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          type: object
          additionalProperties: true
    GenericPayload:
      type: object
      additionalProperties: true
    FilePayload:
      type: object
      properties:
        payload:
          type: string
          description: JSON serializado con los datos del recurso.
        archivos:
          type: array
          items:
            type: string
            format: binary
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: string
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Identificador único del recurso.
    AdjuntoIdParam:
      name: adjuntoId
      in: path
      required: true
      schema:
        type: string
    BitacoraIdParam:
      name: bitacoraId
      in: path
      required: true
      schema:
        type: string
    VehiculoIdParam:
      name: vehiculoId
      in: path
      required: true
      schema:
        type: string
    SalidaIdParam:
      name: salidaId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Token inválido o inexistente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"
