openapi: 3.0.3
info:
  title: Soporte Siroe API
  version: "1.0.0"
  description: |
    API pública del backend de Soporte Siroe. Todas las rutas (salvo las marcadas como públicas) requieren un token Bearer.
    Los payloads mostrados son esquemas generales; revisa los controladores para conocer cada campo obligatorio.
tags:
  - name: Utilidades
    description: Rutas auxiliares utilizadas para pruebas o monitoreo.
  - name: Auth
    description: Inicio de sesión y recuperación de acceso.
  - name: Usuarios
    description: Administración de cuentas y perfiles.
  - name: Clientes
    description: Gestión de clientes, sucursales y su documentación.
  - name: Equipos
    description: ABM de equipos y sus campos configurables.
  - name: Estados
    description: Catálogos y actualizaciones de estados de equipos y sucursales.
  - name: Observaciones
    description: Observaciones y bitácoras ligadas a tickets o clientes.
  - name: Notificaciones
    description: Manejo de notificaciones internas.
  - name: Proyectos
    description: CRUD de proyectos y sus adjuntos.
  - name: Vehiculos
    description: Gestión de vehículos, salidas y adjuntos.
  - name: Bitacoras
    description: Operaciones sobre bitácoras.
  - name: Visitas
    description: Programación y eliminación de visitas.
  - name: Archivos
    description: Utilidades relacionadas a archivos en Google Cloud Storage.
paths:
  /api-test:
    get:
      tags: [Utilidades]
      summary: Verificar que las rutas principales estén registradas.
      responses:
        "200":
          description: Respuesta simple para verificar disponibilidad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /auth-test:
    get:
      tags: [Utilidades]
      summary: Comprueba que las rutas de autenticación están registradas.
      responses:
        "200":
          description: Respuesta con un mensaje de prueba.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /routes:
    get:
      tags: [Utilidades]
      summary: Lista todas las rutas registradas en el servidor.
      responses:
        "200":
          description: Arreglo con metadatos de rutas.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    path:
                      type: string
                    methods:
                      type: array
                      items:
                        type: string
  /auth/login-test:
    get:
      tags: [Utilidades]
      summary: Mensaje informativo sobre el endpoint real de login.
      responses:
        "200":
          description: Mensaje con instrucciones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /test:
    get:
      tags: [Utilidades]
      summary: Healthcheck general del servidor.
      responses:
        "200":
          description: Respuesta indicando que el servidor está activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión mediante correo y contraseña.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Token JWT emitido correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/recuperar-acceso:
    post:
      tags: [Auth]
      summary: Enviar instrucciones para recuperar acceso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Se envió el correo de recuperación si corresponde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /crear-modificar-cuenta:
    post:
      tags: [Usuarios]
      security:
        - bearerAuth: []
      summary: Crear o modificar una cuenta administrada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericPayload"
      responses:
        "200":
          description: Cuenta creada o actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /verificar-correo:
    get:
      tags: [Usuarios]
      security:
        - bearerAuth: []
      summary: Validar si un correo ya existe.
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
          required: true
          description: Correo a verificar.
      responses:
        "200":
          description: Información sobre la disponibilidad del correo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /eliminar-cuenta/{id}:
    get:
      tags: [Usuarios]
      security:
        - bearerAuth: []
      summary: Eliminar una cuenta por ID (método legado).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Resultado de la eliminación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /usuarios:
    get:
      tags: [Usuarios]
      security:
        - bearerAuth: []
      summary: Listar usuarios administrados.
      responses:
        "200":
          description: Lista de usuarios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
  /usuario/{id}:
    get:
      tags: [Usuarios]
      security:
        - bearerAuth: []
      summary: Obtener el detalle de un usuario por ID.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /perfil:
    get:
      tags: [Usuarios]
      security:
        - bearerAuth: []
      summary: Obtener el perfil del usuario autenticado.
      responses:
        "200":
          description: Perfil actual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    put:
      tags: [Usuarios]
      security:
        - bearerAuth: []
      summary: Actualizar el perfil del usuario autenticado.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericPayload"
      responses:
        "200":
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /tecnicos:
    get:
      tags: [Usuarios]
      security:
        - bearerAuth: []
      summary: Obtener técnicos disponibles.
      responses:
        "200":
          description: Listado de técnicos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
  /ingresar-cliente:
    post:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Crear un cliente con soporte de archivos.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                payload:
                  description: JSON serializado con los datos del cliente.
                  type: string
                archivos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Cliente almacenado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /modificar-cliente/{id}:
    post:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Modificar información de un cliente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FilePayload"
      responses:
        "200":
          description: Cliente actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /eliminar-cliente/{id}:
    post:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Eliminar un cliente usando método POST (legado).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Eliminación realizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /clientes/{id}:
    delete:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Eliminar un cliente mediante DELETE canónico.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Cliente eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /clientes/listado:
    get:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Resumen compacto de clientes.
      responses:
        "200":
          description: Listado resumido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
  /documentacion:
    get:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Listar documentación cargada para clientes.
      responses:
        "200":
          description: Documentación disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
    post:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Crear documentación asociada a un cliente.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FilePayload"
      responses:
        "200":
          description: Documento creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /documentacion/{id}:
    delete:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Eliminar documentación de cliente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Documento eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /ingresar-sucursal:
    post:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Crear una nueva sucursal.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericPayload"
      responses:
        "200":
          description: Sucursal creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /eliminar-sucursal/{id}:
    get:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Eliminar una sucursal por ID.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Resultado de la eliminación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /tipos-equipos:
    get:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Listar tipos de equipo y formularios asociados.
      responses:
        "200":
          description: Tipos disponibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
    post:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Crear un tipo de equipo.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericPayload"
      responses:
        "200":
          description: Tipo creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /tipos-equipos/{id}:
    put:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Actualizar un tipo de equipo.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericPayload"
      responses:
        "200":
          description: Tipo actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Eliminar un tipo de equipo.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Eliminado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /tipos-equipos/{id}/campos:
    get:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Obtener campos configurados para un tipo de equipo.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Campos encontrados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
    put:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Sincronizar campos de un tipo de equipo.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                campos:
                  type: array
                  items:
                    $ref: "#/components/schemas/GenericPayload"
      responses:
        "200":
          description: Campos sincronizados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /campos:
    get:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Listar campos disponibles.
      responses:
        "200":
          description: Lista de campos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
    post:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Crear un campo personalizado.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericPayload"
      responses:
        "200":
          description: Campo creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /campos/{id}:
    put:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Actualizar un campo.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericPayload"
      responses:
        "200":
          description: Campo actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Eliminar un campo.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /departamentos-equipos:
    get:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Listar departamentos de equipo.
      responses:
        "200":
          description: Departamentos disponibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
    post:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Crear un departamento de equipo.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericPayload"
      responses:
        "200":
          description: Departamento creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /departamentos-equipos/{id}:
    put:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Actualizar un departamento de equipo.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericPayload"
      responses:
        "200":
          description: Departamento actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Eliminar un departamento de equipo.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /ingresar-equipo:
    post:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Crear un equipo nuevo (soporta archivos).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FilePayload"
      responses:
        "200":
          description: Equipo creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /modificar-equipo/{id}:
    post:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Actualizar información de un equipo.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FilePayload"
      responses:
        "200":
          description: Equipo actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /eliminar-equipo/{id}:
    post:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Eliminar un equipo (método POST legado).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Equipo eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /equipos/{id}:
    delete:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Eliminar un equipo vía DELETE.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Eliminado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /obtener-formulario/{id}:
    get:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Obtener el formulario configurado para un tipo de equipo.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Datos del formulario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /estados-equipos:
    get:
      tags: [Estados]
      security:
        - bearerAuth: []
      summary: Catálogo de estados de equipos.
      responses:
        "200":
          description: Listado de estados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
  /estados-equipos/{id}:
    patch:
      tags: [Estados]
      security:
        - bearerAuth: []
      summary: Actualizar campos de un estado de equipo.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericPayload"
      responses:
        "200":
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /actualizar-estado-equipo/{id}:
    post:
      tags: [Estados]
      security:
        - bearerAuth: []
      summary: Actualización rápida del estado de un equipo.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                estadoId:
                  type: string
      responses:
        "200":
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /estados-sucursales:
    get:
      tags: [Estados]
      security:
        - bearerAuth: []
      summary: Catálogo de estados de sucursales.
      responses:
        "200":
          description: Listado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
  /actualizar-estado-sucursal/{id}:
    post:
      tags: [Estados]
      security:
        - bearerAuth: []
      summary: Actualizar el estado de una sucursal.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                estadoId:
                  type: string
      responses:
        "200":
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /ingresar-observacion/{id}:
    post:
      tags: [Observaciones]
      security:
        - bearerAuth: []
      summary: Registrar una observación vinculada a un equipo o cliente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                observacion:
                  type: string
      responses:
        "200":
          description: Observación creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /clientes:
    get:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Obtener clientes paginados o filtrados.
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Texto de búsqueda opcional.
      responses:
        "200":
          description: Resultados de búsqueda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
  /cliente/{id}:
    get:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Obtener detalle completo de un cliente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /cliente/{id}/sucursales:
    get:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Listar las sucursales de un cliente.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Sucursales del cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
  /cliente/{id}/equipos:
    get:
      tags: [Equipos]
      security:
        - bearerAuth: []
      summary: Obtener los equipos de una casa matriz.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Equipos encontrados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
  /sucursal/{id}:
    get:
      tags: [Clientes]
      security:
        - bearerAuth: []
      summary: Obtener información de una sucursal por ID.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Sucursal encontrada.
          content:
